<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>404 - Profesionalía No Encontrada</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .content {
            max-width: 480px;
        }

        .icon {
            margin-bottom: 2rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-14px); }
        }

        h1 {
            font-size: clamp(5rem, 20vw, 9rem);
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            line-height: 1;
            margin-bottom: 1rem;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            margin-bottom: 1rem;
        }

        p {
            color: #9ca3af;
            font-style: italic;
            font-weight: 500;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        a {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: #fff;
            color: #000;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.8rem;
            border-radius: 9999px;
            text-decoration: none;
            transition: background 0.2s ease;
        }

        a:hover {
            background: #e5e7eb;
        }
    </style>
</head>
<body>
    <div class="content">
        <svg class="icon" width="88" height="88" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="6" cy="6" r="3"></circle>
            <path d="M8.12 8.12 12 12"></path>
            <path d="M20 4 8.12 15.88"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <path d="M14.8 14.8 20 20"></path>
        </svg>
        <h1>404</h1>
        <h2>Profesionalía No Encontrada</h2>
        <p>La página o professionalía que buscas no existe o fue movida. Verifica el enlace e inténtalo de nuevo.</p>
        <a href="/">Volver al Inicio</a>
    </div>
</body>
</html>
